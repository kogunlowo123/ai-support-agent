# Local stack. `docker compose up` gives a working agent on http://localhost:8000
# with no editing: SQLite on a named volume, no model, authentication off.
#
# Two optional profiles:
#   --profile ollama    adds a local model, so replies are phrased rather than
#                       rendered from tool results
#   --profile postgres  swaps SQLite for PostgreSQL, which is what a deployment
#                       with more than one process needs
#
# Nothing here is a production manifest. It has no TLS, no secret management and
# no replicas; docs/operations.md says what a real deployment adds.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-support-agent:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_ENVIRONMENT: local
      AGENT_STORAGE__DATABASE_URL: sqlite+aiosqlite:////app/var/agent.db
      # Off for local use only. A deployed instance sets this true and supplies
      # keys; production refuses to start without both.
      AGENT_SECURITY__REQUIRE_API_KEY: "false"
      AGENT_CHAT__BACKEND: template
      AGENT_OBSERVABILITY__LOG_FORMAT: json
      AGENT_OBSERVABILITY__LOG_LEVEL: INFO
    volumes:
      - agent-data:/app/var
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

  # `docker compose --profile ollama up`. First run pulls the model, which takes
  # a few minutes; until it is ready the agent composes from tool results, which
  # is a documented degraded mode rather than an outage.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # `docker compose --profile ollama up` also runs this once to fetch the model.
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.11
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]
    restart: "no"

  postgres:
    profiles: ["postgres"]
    image: postgres:17.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Local-only credentials for a database bound to loopback. A deployment
      # takes these from a secret store, never from a compose file.
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent-data:
  ollama-models:
  postgres-data:
